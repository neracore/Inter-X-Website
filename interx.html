    };

    const guessLanguage = (text = "") => {
      if (/[\u067E\u0686\u0698\u06AF\u06A9\u06CC]/u.test(text)) return "fa";
      if (/\p{Script=Han}|\p{Script=Hiragana}|\p{Script=Katakana}/u.test(text)) return "ja";
      if (/\p{Script=Hangul}/u.test(text)) return "ko";
      if (/\p{Script=Cyrillic}/u.test(text)) return "ru";
      if (/\p{Script=Devanagari}/u.test(text)) return "hi";
      if (/[\u0600-\u06FF]/u.test(text)) return "ar";
      return "auto";
    };

    const TranslationEngine = {
      async translate(text, targetLang, sourceLang = "auto") {
        if (!text?.trim()) return "";
        const src = sourceLang || "auto";
        const memoryUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(src)}|${encodeURIComponent(targetLang)}`;
        try {
          const res = await fetch(memoryUrl);
          if (res.ok) {
            const data = await res.json();
            const out = data?.responseData?.translatedText || "";
            if (out) return out;
          }
        } catch {}

        const googleUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dj=1&sl=${encodeURIComponent(src)}&tl=${encodeURIComponent(targetLang)}&q=${encodeURIComponent(text)}`;
        const backupRes = await fetch(googleUrl);
        if (!backupRes.ok) throw new Error("translate failed");
        const backupData = await backupRes.json();
        return Array.isArray(backupData?.sentences) ? backupData.sentences.map((s) => s?.trans || "").join("") : text;
      }
    };

    // ==========================================
    // 2. CRYPTO & SECURITY ENGINE
    // ==========================================
    const SecurityEngine = {
      toBase64(buf) {
        return btoa(String.fromCharCode(...new Uint8Array(buf)));
      },
      fromBase64(str) {
        return Uint8Array.from(atob(str), c => c.charCodeAt(0));
      },
      async hashPassword(password, saltBase64) {
        if (!window.crypto?.subtle) {
          // Fallback simple hash for older environments
          return btoa(unescape(encodeURIComponent(password + saltBase64)));
        }
        const encoder = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          encoder.encode(password),
          "PBKDF2",
          false,
          ["deriveBits"]
        );
        const bits = await crypto.subtle.deriveBits(
          {
            name: "PBKDF2",
            salt: this.fromBase64(saltBase64),
            iterations: PBKDF2_ITERATIONS,
            hash: "SHA-256"
          },
          keyMaterial,
          256
        );
        return this.toBase64(bits);
      },
      async createPasswordRecord(password) {
        const salt = new Uint8Array(16);
        crypto.getRandomValues(salt);
        const saltBase64 = this.toBase64(salt.buffer);
        const hash = await this.hashPassword(password, saltBase64);
        return { hash, salt: saltBase64, createdAt: Date.now() };
      },
      async verifyPassword(password, record) {
        if (!record?.hash || !record?.salt) return false;
        const candidateHash = await this.hashPassword(password, record.salt);
        return candidateHash === record.hash;
      },
      sanitizeUsername(u = "") {
        return u.toLowerCase().replace(/@/g, "").replace(/\s+/g, "").replace(/[^a-z0-9_]/g, "").slice(0, 30);
      },
      validatePassword(p = "") {
        return p.length >= 8 && /[A-Z]/.test(p) && /[a-z]/.test(p) && /[0-9]/.test(p);
      }
    };

    // ==========================================
    // 3. SEED COMMUNITY DATA (Live Network Demo)
    // ==========================================
    const DEFAULT_COMMUNITY_USERS = [];

    // ==========================================
    // 4. DATA LAYER & SERVER ADAPTER
    // ==========================================
    class ServerDataLayer {
      constructor() {
        this.broadcastChannel = null;
        try {
          if (typeof window !== "undefined" && "BroadcastChannel" in window) {
            this.broadcastChannel = new BroadcastChannel(CHANNEL_NAME);
          }
        } catch (e) {
          console.warn("BroadcastChannel not supported", e);
        }
      }

      loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            if (data && typeof data === "object") {
              return this.ensureStructure(data);
            }
          }
        } catch (e) {
          console.error("Storage load error:", e);
        }
        return this.getInitialState();
      }

      saveState(state) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.error("Storage save error:", e);
        }
      }

      broadcast(type, payload) {
        if (this.broadcastChannel) {
          try {
            this.broadcastChannel.postMessage({ type, payload, timestamp: Date.now() });
          } catch (e) {
            console.error("Broadcast error:", e);
          }
        }
      }

      ensureStructure(data) {
        const initial = this.getInitialState();
        const users = Array.isArray(data.users) ? data.users.filter((u) => !["user_official", "user_lautaro", "user_curvanord"].includes(u?.id)) : [];
        const sessionUserId = users.some((u) => u.id === data.sessionUserId) ? data.sessionUserId : null;
        return {
          users,
          posts: Array.isArray(data.posts) ? data.posts : [],
          comments: Array.isArray(data.comments) ? data.comments : [],
          likes: data.likes && typeof data.likes === "object" ? data.likes : {},
          bookmarks: data.bookmarks && typeof data.bookmarks === "object" ? data.bookmarks : {},
          follows: data.follows && typeof data.follows === "object" ? data.follows : {},
          sessionUserId,
          settings: { ...initial.settings, ...(data.settings || {}) },
          sharedUpdatedAt: Number(data.sharedUpdatedAt) || 0
        };
      }

      // Live Server Publish to ntfy cloud topic for all devices
      async publishLiveEvent(type, payload) {
        this.broadcast(type, payload);
        try {
          await fetch(REALTIME_SERVER_URL, {
            method: "POST",
            body: JSON.stringify({ type, payload, timestamp: Date.now() })
          });
        } catch (err) {
          console.warn("Live event push error:", err);
        }
      }

      // Fetch recent history sent to the live server
      async fetchLiveHistory(onEvent) {
        try {
          const res = await fetch(`${REALTIME_SERVER_URL}/json?poll=1&since=all`);
          if (!res.ok) return;
          const text = await res.text();
          const lines = text.trim().split("\n");
          lines.forEach((line) => {
            if (!line) return;
            try {
              const json = JSON.parse(line);
              if (json.event === "message" && json.message) {
                const parsed = JSON.parse(json.message);
                if (parsed.type && parsed.payload) {
                  onEvent(parsed.type, parsed.payload);
                }
              }
            } catch (e) {}
          });
        } catch (err) {
          console.warn("History pull error:", err);
        }
      }

      // Live Server EventSource (SSE) listener for realtime instant sync
      connectLiveServer(onEvent, onStatus) {
        let es = null;
        try {
          es = new EventSource(`${REALTIME_SERVER_URL}/sse`);
          es.onopen = () => onStatus("cloudOn");
          es.onerror = () => onStatus("cloudRetry");
          es.onmessage = (e) => {
            try {
              const json = JSON.parse(e.data);
              if (json.event === "message" && json.message) {
                const parsed = JSON.parse(json.message);
                if (parsed.type && parsed.payload) {
                  onEvent(parsed.type, parsed.payload);
                }
              }
            } catch (err) {}
          };
        } catch (err) {
          onStatus("cloudDown");
        }
        return () => {
          if (es) es.close();
        };
      }

      getInitialState() {
        const browserLang = (typeof navigator !== "undefined" ? (navigator.language || "fa") : "fa").slice(0, 2).toLowerCase();
        const safeLang = SUPPORTED_LANGUAGES.some((l) => l.code === browserLang) ? browserLang : "fa";
        return {
          users: DEFAULT_COMMUNITY_USERS,
          posts: [], // Completely clean posts as requested
          comments: [],
          likes: {},
          bookmarks: {},
          sessionUserId: null,
          settings: {
            theme: "dark",
            language: safeLang,
            soundEnabled: true,
            autoPlayVideo: false,
            fontScale: 1,
            serverSync: true
          },
          follows: {},
          sharedUpdatedAt: 0
        };
      }
    }

      Verified: () => (

      Sparkles: () => (

          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />

    // ==========================================
    // 6. MAIN APP COMPONENT
    // ==========================================
    function InterXApp() {
      // Global App State
      const [appData, setAppData] = useState(() => dataLayer.loadState());
      const [currentRoute, setCurrentRoute] = useState("home"); // home, search, bookmarks, profile, settings
      const [activeTab, setActiveTab] = useState("forYou"); // forYou, following
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [composeModalOpen, setComposeModalOpen] = useState(false);
      const [activeCommentPostId, setActiveCommentPostId] = useState(null);
      const [lightboxMedia, setLightboxMedia] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [searchQuery, setSearchQuery] = useState("");
      const [profileTargetUserId, setProfileTargetUserId] = useState(null);
      const [cloudStatus, setCloudStatus] = useState("Global sync standby");
      const skipSnapshotPublishRef = useRef(false);
      const latestStateRef = useRef(appData);
      const lastPushedSharedTsRef = useRef(0);

      // Current Logged-in User
      const currentUser = useMemo(() => {
        return appData.users.find(u => u.id === appData.sessionUserId) || null;
      }, [appData.users, appData.sessionUserId]);

      const uiLang = appData.settings.language || "fa";
      const t = useCallback((key) => UI_TEXT[uiLang]?.[key] || UI_TEXT.en[key] || key, [uiLang]);

      const sortedPosts = useMemo(() => {
        return [...appData.posts].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      }, [appData.posts]);

      const followingIds = useMemo(() => {
        if (!currentUser) return [];
        return appData.follows?.[currentUser.id] || [];
      }, [appData.follows, currentUser]);

      const isFollowingUser = useCallback((userId) => followingIds.includes(userId), [followingIds]);

      const homePosts = useMemo(() => {
        if (activeTab !== "following" || !currentUser) return sortedPosts;
        return sortedPosts.filter((p) => p.userId === currentUser.id || followingIds.includes(p.userId));
      }, [activeTab, currentUser, sortedPosts, followingIds]);

      const [translationCache, setTranslationCache] = useState({});
      const [translationLoading, setTranslationLoading] = useState({});
      const [showOriginalMap, setShowOriginalMap] = useState({});

      const translationKey = useCallback((entity, id, lang) => `${entity}:${id}:${lang}`, []);

      const ensureTranslation = useCallback(async (entity, id, text, sourceLang) => {
        const targetLang = appData.settings.language || "fa";
        const normalizedSource = sourceLang || guessLanguage(text);
        if (!text?.trim() || normalizedSource === targetLang) return;
        const key = translationKey(entity, id, targetLang);
        if (translationCache[key] || translationLoading[key]) return;

        setTranslationLoading((prev) => ({ ...prev, [key]: true }));
        try {
          const translated = await TranslationEngine.translate(text, targetLang, normalizedSource);
          setTranslationCache((prev) => ({ ...prev, [key]: translated || text }));
        } catch {
          setTranslationCache((prev) => ({ ...prev, [key]: text }));
        } finally {
          setTranslationLoading((prev) => {
            const next = { ...prev };
            delete next[key];
            return next;
          });
        }
      }, [appData.settings.language, translationCache, translationLoading, translationKey]);

      const toggleOriginal = useCallback((entity, id) => {
        const key = `${entity}:${id}`;
        setShowOriginalMap((prev) => ({ ...prev, [key]: !prev[key] }));
      }, []);

      const updateShared = useCallback((updater) => {
        setAppData((prev) => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          return { ...next, sharedUpdatedAt: Date.now() };
        });
      }, []);

      const buildSnapshotPayload = useCallback((snapshot) => ({
        users: snapshot.users,
        posts: snapshot.posts,
        comments: snapshot.comments,
        likes: snapshot.likes,
        bookmarks: snapshot.bookmarks,
        follows: snapshot.follows,
        sharedUpdatedAt: snapshot.sharedUpdatedAt
      }), []);

      // Save on State Change
      useEffect(() => {
        dataLayer.saveState(appData);
        latestStateRef.current = appData;
        if (appData.settings.theme === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        } else {
          document.documentElement.removeAttribute("data-theme");
        }
        document.documentElement.style.setProperty("--font-scale", appData.settings.fontScale || 1);
        document.documentElement.lang = uiLang;
        document.documentElement.dir = RTL_LANGS.includes(uiLang) ? "rtl" : "ltr";
      }, [appData, uiLang]);

      // Toast Dispatcher
      const addToast = useCallback((message, type = "info", action = null) => {
        const id = "t_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
        setToasts(prev => [...prev, { id, message, type, action }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      }, []);

      // Unified Server & Realtime Event Processor
      const processRemoteEvent = useCallback((type, payload) => {
        if (!type || !payload) return;
        if (type === "NEW_POST") {
          setAppData((prev) => {
            if (prev.posts.some((p) => p.id === payload.id)) return prev;
            return { ...prev, posts: [payload, ...prev.posts], sharedUpdatedAt: Date.now() };
          });
        } else if (type === "LIKE_TOGGLE") {
          setAppData((prev) => ({
            ...prev,
            likes: { ...prev.likes, [payload.postId]: payload.likes },
            sharedUpdatedAt: Date.now()
          }));
        } else if (type === "NEW_COMMENT") {
          setAppData((prev) => {
            if (prev.comments.some((c) => c.id === payload.id)) return prev;
            return {
              ...prev,
              comments: [...prev.comments, payload],
              sharedUpdatedAt: Date.now()
            };
          });
        } else if (type === "DELETE_POST") {
          setAppData((prev) => ({
            ...prev,
            posts: prev.posts.filter((p) => p.id !== payload.postId),
            sharedUpdatedAt: Date.now()
          }));
        } else if (type === "USER_SYNC") {
          setAppData((prev) => {
            const exists = prev.users.some((u) => u.id === payload.id);
            return {
              ...prev,
              users: exists ? prev.users.map((u) => (u.id === payload.id ? payload : u)) : [...prev.users, payload]
            };
          });
        } else if (type === "FOLLOWS_SYNC") {
          setAppData((prev) => ({
            ...prev,
            follows: { ...prev.follows, [payload.userId]: payload.following }
          }));
        } else if (type === "SNAPSHOT_REQUEST") {
          if (!currentUser) return;
          dataLayer.publishLiveEvent("STATE_SNAPSHOT", buildSnapshotPayload(latestStateRef.current));
        } else if (type === "STATE_SNAPSHOT") {
          setAppData((prev) => {
            const incomingPosts = Array.isArray(payload.posts) ? payload.posts : [];
            const incomingUsers = Array.isArray(payload.users) ? payload.users : [];
            const useIncoming =
              (Number(payload.sharedUpdatedAt) || 0) > (Number(prev.sharedUpdatedAt) || 0) ||
              incomingPosts.length > prev.posts.length;
            if (!useIncoming) return prev;
            skipSnapshotPublishRef.current = true;
            return {
              ...prev,
              users: incomingUsers,
              posts: incomingPosts,
              comments: Array.isArray(payload.comments) ? payload.comments : [],
              likes: payload.likes && typeof payload.likes === "object" ? payload.likes : {},
              bookmarks: payload.bookmarks && typeof payload.bookmarks === "object" ? payload.bookmarks : {},
              follows: payload.follows && typeof payload.follows === "object" ? payload.follows : {},
              sharedUpdatedAt: Number(payload.sharedUpdatedAt) || Date.now()
            };
          });
        }
      }, [addToast, buildSnapshotPayload, currentUser]);

      useEffect(() => {
        if (!appData.settings.serverSync || !appData.sharedUpdatedAt) return;
        if (skipSnapshotPublishRef.current) {
          skipSnapshotPublishRef.current = false;
          return;
        }
        dataLayer.publishLiveEvent("STATE_SNAPSHOT", buildSnapshotPayload(appData));
      }, [appData.sharedUpdatedAt, appData.settings.serverSync, appData, buildSnapshotPayload]);

      // 1. Listen on local tabs via BroadcastChannel
      useEffect(() => {
        if (!dataLayer.broadcastChannel) return;
        const handleMessage = (e) => {
          const { type, payload } = e.data || {};
          processRemoteEvent(type, payload);
        };
        dataLayer.broadcastChannel.onmessage = handleMessage;
        return () => {
          if (dataLayer.broadcastChannel) dataLayer.broadcastChannel.onmessage = null;
        };
      }, [processRemoteEvent]);

      // 2. Fetch history and connect live SSE stream to global cloud server
      useEffect(() => {
        if (!appData.settings.serverSync) {
          setCloudStatus("cloudOff");
          return;
        }

        const pullHistory = () => dataLayer.fetchLiveHistory((type, payload) => {
          processRemoteEvent(type, payload);
        });

        // Pull existing posts history from server
        pullHistory();
        dataLayer.publishLiveEvent("SNAPSHOT_REQUEST", { ts: Date.now() });
        const historyTimer = setInterval(pullHistory, 30000);

        // Open live Server-Sent Events stream for instant cross-device updates
        const disconnect = dataLayer.connectLiveServer(
          (type, payload) => {
            processRemoteEvent(type, payload);
          },
          (statusText) => {
            setCloudStatus(statusText);
          }
        );

        return () => {
          clearInterval(historyTimer);
          disconnect();
        };
      }, [appData.settings.serverSync, processRemoteEvent]);

      // Actions: Post Creation
      const handleCreatePost = (text, media = []) => {
        if (!currentUser) {
          setAuthModalOpen(true);
          return;
        }
        const newPost = {
          id: "post_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
          userId: currentUser.id,
          username: currentUser.username,
          displayName: currentUser.displayName,
          userAvatar: currentUser.avatar,
          userVerified: !!currentUser.verified,
          text: text.trim(),
          lang: (() => {
            const detected = guessLanguage(text.trim());
            return detected === "auto" ? (appData.settings.language || "fa") : detected;
          })(),
          media: media,
          createdAt: Date.now(),
          likesCount: 0,
          commentsCount: 0
        };

        updateShared(prev => ({
          ...prev,
          posts: [newPost, ...prev.posts]
        }));

        dataLayer.publishLiveEvent("NEW_POST", newPost);
        addToast("Your post has been published", "success");
        setComposeModalOpen(false);
      };

      // Actions: Like
      const handleToggleLike = (postId) => {
        if (!currentUser) {
          setAuthModalOpen(true);
          return;
        }
        updateShared(prev => {
          const currentLikes = prev.likes[postId] || [];
          const hasLiked = currentLikes.includes(currentUser.id);
          const nextLikes = hasLiked
            ? currentLikes.filter(id => id !== currentUser.id)
            : [...currentLikes, currentUser.id];

          dataLayer.publishLiveEvent("LIKE_TOGGLE", { postId, likes: nextLikes });

          return {
            ...prev,
            likes: { ...prev.likes, [postId]: nextLikes }
          };
        });
      };

      // Actions: Bookmark
      const handleToggleBookmark = (postId) => {
        if (!currentUser) {
          setAuthModalOpen(true);
          return;
        }
        updateShared(prev => {
          const currentBookmarks = prev.bookmarks[currentUser.id] || [];
          const hasBookmarked = currentBookmarks.includes(postId);
          const nextBookmarks = hasBookmarked
            ? currentBookmarks.filter(id => id !== postId)
            : [...currentBookmarks, postId];

          addToast(hasBookmarked ? "Removed from bookmarks" : "Added to bookmarks", "info");

          return {
            ...prev,
            bookmarks: { ...prev.bookmarks, [currentUser.id]: nextBookmarks }
          };
        });
      };

      const handleToggleFollow = (targetUserId) => {
        if (!currentUser || !targetUserId || currentUser.id === targetUserId) return;
        updateShared((prev) => {
          const currentFollowing = prev.follows?.[currentUser.id] || [];
          const isFollowing = currentFollowing.includes(targetUserId);
          const nextFollowing = isFollowing
            ? currentFollowing.filter((id) => id !== targetUserId)
            : [...currentFollowing, targetUserId];

          dataLayer.publishLiveEvent("FOLLOWS_SYNC", { userId: currentUser.id, following: nextFollowing });
          addToast(isFollowing ? "Unfollowed" : "Followed", "info");

          return {
            ...prev,
            follows: { ...prev.follows, [currentUser.id]: nextFollowing }
          };
        });
      };

      // Actions: Delete Post
      const handleDeletePost = (postId) => {
        const targetPost = appData.posts.find(p => p.id === postId);
        if (!targetPost) return;

        updateShared(prev => ({
          ...prev,
          posts: prev.posts.filter(p => p.id !== postId)
        }));

        dataLayer.publishLiveEvent("DELETE_POST", { postId });

        addToast("Post deleted", "warning", {
          label: "Undo",
          onClick: () => {
            updateShared(prev => ({
              ...prev,
              posts: [targetPost, ...prev.posts]
            }));
            dataLayer.publishLiveEvent("NEW_POST", targetPost);
            addToast("Post restored", "success");
          }
        });
      };

      // Actions: Add Comment
      const handleAddComment = (postId, text) => {
        if (!currentUser) {
          setAuthModalOpen(true);
          return;
        }
        const newComment = {
          id: "c_" + Date.now(),
          postId,
          userId: currentUser.id,
          username: currentUser.username,
          displayName: currentUser.displayName,
          userAvatar: currentUser.avatar,
          text: text.trim(),
          lang: (() => {
            const detected = guessLanguage(text.trim());
            return detected === "auto" ? (appData.settings.language || "fa") : detected;
          })(),
          createdAt: Date.now()
        };

        updateShared(prev => ({
          ...prev,
          comments: [...prev.comments, newComment]
        }));

        dataLayer.publishLiveEvent("NEW_COMMENT", newComment);
        addToast("Comment posted", "success");
      };

      // Navigation Helper
      const navigateTo = (route, targetUserId = null) => {
        setCurrentRoute(route);
        if (targetUserId) setProfileTargetUserId(targetUserId);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <div className="min-h-screen bg-black text-white flex justify-center selection:bg-blue-600">
          <div className="w-full max-w-7xl flex flex-row">

            {/* Left Desktop Sidebar Navigation */}

          {/* Global Toast Container */}
          <div className="fixed bottom-20 md:bottom-6 left-6 z-50 space-y-2 max-w-sm w-full pointer-events-none">
            {toasts.map(t => (
              <div
                key={t.id}
                className={`p-3.5 rounded-2xl border backdrop-blur-xl pointer-events-auto shadow-2xl flex items-center justify-between text-xs font-semibold animate-slide-down ${
                  t.type === 'success' ? 'bg-emerald-950/90 border-emerald-500/40 text-emerald-200' :
                  t.type === 'warning' ? 'bg-amber-950/90 border-amber-500/40 text-amber-200' :
                  t.type === 'error' ? 'bg-rose-950/90 border-rose-500/40 text-rose-200' :
                  'bg-zinc-900/90 border-blue-500/40 text-white'
                }`}
              >
                <span>{t.message}</span>
                {t.action && (
                  <button
                    onClick={t.action.onClick}
                    className="mr-3 px-2.5 py-1 rounded-lg bg-white/20 hover:bg-white/30 text-white font-bold transition"
                  >
                    {t.action.label}
                  </button>
                )}
              </div>
            ))}
          </div>

        </div>
      );
    }

    // ==========================================
    // 7. NAVIGATION ITEM COMPONENT
    // ==========================================
    function NavItem({ icon, label, active, onClick, badge }) {
      return (
        <button
          onClick={onClick}
          className={`w-full flex items-center gap-4 p-3 rounded-full transition-all group ${
            active ? 'font-black text-white bg-blue-600/10 border border-blue-500/30' : 'text-zinc-400 hover:text-white hover:bg-zinc-900/60 font-medium'
          }`}
        >
          <div className="relative">
            {icon}
            {badge && <span className="absolute -top-1 -right-1 px-1 text-[9px] font-bold bg-rose-600 text-white rounded-full">{badge}</span>}
          </div>
          <span className="hidden xl:inline text-base tracking-tight">{label}</span>
        </button>
      );
    }

    // ==========================================
    // 8. COMPOSER BOX (Optimized Media & Drafts)
    // ==========================================
    function ComposerBox({ currentUser, onPublish, onRequireAuth, uiLang }) {
      const tt = (key) => UI_TEXT[uiLang]?.[key] || UI_TEXT.en[key] || key;
      const [text, setText] = useState("");
      const [mediaList, setMediaList] = useState([]);
      const [emojiPickerOpen, setEmojiPickerOpen] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);

      const interEmojis = ["💙", "🖤", "⚽", "🏆", "🔥", "🐂", "🐍", "⭐", "🇮🇹", "👏", "👑", "💪"];

      const handleFiles = (files) => {
        Array.from(files).forEach(file => {
          if (file.size > 15 * 1024 * 1024) {
            alert("File size must be less than 15MB.");
            return;
          }
          const isVideo = file.type.startsWith("video/");
          const reader = new FileReader();
          reader.onload = (e) => {
            setMediaList(prev => [...prev, {
              id: "m_" + Date.now() + Math.random(),
              type: isVideo ? "video" : "image",
              url: e.target.result
            }]);
          };
          reader.readAsDataURL(file);
        });
      };

      const handleSubmit = () => {
        if (!currentUser) {
          onRequireAuth();
          return;
        }
        if (!text.trim() && mediaList.length === 0) return;
        onPublish(text, mediaList);
        setText("");
        setMediaList([]);
      };

      return (
        <div
          onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
          onDragLeave={() => setIsDragging(false)}
          onDrop={(e) => { e.preventDefault(); setIsDragging(false); handleFiles(e.dataTransfer.files); }}
          className={`p-2 transition rounded-2xl ${isDragging ? 'ring-2 ring-blue-500 bg-blue-950/20' : ''}`}
        >
          <div className="flex gap-3">
            <div className="w-10 h-10 rounded-full overflow-hidden bg-blue-900/40 border border-blue-500/40 flex items-center justify-center font-bold text-blue-400 shrink-0">
              {currentUser?.avatar ? <img src={currentUser.avatar} className="w-full h-full object-cover" /> : (currentUser?.displayName?.[0] || "I")}
            </div>
            
            <div className="flex-1 space-y-3">
              <textarea
                value={text}
                onChange={(e) => setText(e.target.value)}
                maxLength={MAX_POST_CHARS}
                placeholder={tt("composePlaceholder")}
                rows="3"
                className="w-full bg-transparent text-sm md:text-base text-white placeholder-zinc-500 border-none outline-none resize-none"
              />

              {/* Media Previews */}
              {mediaList.length > 0 && (
                <div className="grid grid-cols-2 gap-2 pt-2">
                  {mediaList.map((m, i) => (
                    <div key={m.id} className="relative rounded-2xl overflow-hidden border border-zinc-800 bg-zinc-900 group aspect-video">
                      {m.type === "video" ? (
                        <video src={m.url} className="w-full h-full object-cover" />
                      ) : (
                        <img src={m.url} className="w-full h-full object-cover" />
                      )}
                      <button
                        onClick={() => setMediaList(prev => prev.filter((_, idx) => idx !== i))}
                        className="absolute top-2 right-2 p-1.5 rounded-full bg-black/70 text-white hover:bg-rose-600 transition"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              )}

              {/* Emojis drawer */}
              {emojiPickerOpen && (
                <div className="p-2 rounded-2xl bg-zinc-900 border border-zinc-800 flex flex-wrap gap-2 animate-slide-down">
                  {interEmojis.map(e => (
                    <button
                      key={e}
                      onClick={() => setText(prev => prev + " " + e)}
                      className="text-lg hover:scale-125 transition p-1"
                    >
                      {e}
                    </button>
                  ))}
                </div>
              )}

              {/* Action Bar */}
              <div className="flex items-center justify-between pt-2 border-t border-zinc-800/40">
                <div className="flex items-center gap-2">
                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={(e) => handleFiles(e.target.files)}
                    multiple
                    accept="image/*,video/*"
                    className="hidden"
                  />
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    title="Add image or video"
                    className="p-2 rounded-full text-blue-400 hover:bg-blue-950/40 transition"
                  >
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                  </button>
                  <button
                    onClick={() => setEmojiPickerOpen(prev => !prev)}
                    title="Emoji"
                    className="p-2 rounded-full text-blue-400 hover:bg-blue-950/40 transition text-sm"
                  >
                    😊
                  </button>
                </div>

                <div className="flex items-center gap-3">
                  <span className={`text-xs ${text.length > MAX_POST_CHARS - 100 ? 'text-rose-500 font-bold' : 'text-zinc-500'}`}>
                    {text.length}/{MAX_POST_CHARS}
                  </span>
                  <button
                    onClick={handleSubmit}
                    disabled={!text.trim() && mediaList.length === 0}
                    className="px-5 py-2 rounded-full bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed font-bold text-xs text-white shadow-md shadow-blue-900/30 transition transform active:scale-95"
                  >
                    {tt("publish")}
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 9. POST CARD COMPONENT
    // ==========================================
    function PostCard({ post, currentUser, isLiked, likesCount, isBookmarked, commentsCount, onToggleLike, onToggleBookmark, onOpenComment, onDelete, onOpenMedia, onUserClick, preferredLanguage, ensureTranslation, translationCache, translationLoading, showOriginal, onToggleOriginal, uiLang, isFollowingUser, onToggleFollowUser }) {
      const [menuOpen, setMenuOpen] = useState(false);
      const isOwner = currentUser?.id === post.userId;
      const tt = (key) => UI_TEXT[uiLang]?.[key] || UI_TEXT.en[key] || key;

      // Time Formatter
      const timeAgo = useMemo(() => {
        const diffSec = Math.floor((Date.now() - post.createdAt) / 1000);
        const rtf = new Intl.RelativeTimeFormat(uiLang, { numeric: "auto" });
        if (diffSec < 60) return rtf.format(-diffSec, "second");
        if (diffSec < 3600) return rtf.format(-Math.floor(diffSec / 60), "minute");
        if (diffSec < 86400) return rtf.format(-Math.floor(diffSec / 3600), "hour");
        return rtf.format(-Math.floor(diffSec / 86400), "day");
      }, [post.createdAt, uiLang]);

      const detectedPostLang = guessLanguage(post.text || "");
      const sourceLang = detectedPostLang === "auto" ? (post.lang || "auto") : detectedPostLang;
      const shouldTranslate = !!preferredLanguage && !!post.text?.trim() && preferredLanguage !== sourceLang;
      const postTranslationKey = `post:${post.id}:${preferredLanguage}`;
      const translatedText = translationCache[postTranslationKey];
      const loadingTranslation = !!translationLoading[postTranslationKey];

      useEffect(() => {
        if (shouldTranslate && showOriginal) {
          ensureTranslation("post", post.id, post.text, sourceLang);
        }
      }, [shouldTranslate, showOriginal, ensureTranslation, post.id, post.text, sourceLang]);

      const displayText = showOriginal && shouldTranslate && translatedText ? translatedText : post.text;

      // Highlight Hashtags & Mentions
      const formattedText = useMemo(() => {
        const parts = displayText.split(/(#[a-zA-Z0-9_\u0600-\u06FF]+|@[a-zA-Z0-9_]+)/g);
        return parts.map((part, i) => {
          if (part.startsWith("#")) {
            return <span key={i} className="text-blue-400 font-semibold hover:underline cursor-pointer">{part}</span>;
          }
          if (part.startsWith("@")) {
            return <span key={i} className="text-blue-400 font-semibold hover:underline cursor-pointer">{part}</span>;
          }
          return part;
        });
      }, [displayText]);

      return (
        <article className="p-4 hover:bg-zinc-950/40 transition duration-150 relative">
          <div className="flex gap-3">
            {/* User Avatar */}
            <div
              onClick={() => onUserClick(post.userId)}
              className="w-10 h-10 rounded-full overflow-hidden bg-blue-900/30 border border-blue-500/30 flex items-center justify-center font-bold text-blue-400 shrink-0 cursor-pointer hover:opacity-80 transition"
            >
              {post.userAvatar ? <img src={post.userAvatar} className="w-full h-full object-cover" /> : post.displayName[0]}
            </div>

            {/* Post Content */}
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span onClick={() => onUserClick(post.userId)} className="font-bold text-sm text-white hover:underline cursor-pointer">
                    {post.displayName}
                  </span>
                  {post.userVerified && <Icons.Verified />}
                  <span className="text-xs text-zinc-500">@{post.username}</span>
                  <span className="text-zinc-600">·</span>
                  <span className="text-xs text-zinc-500">{timeAgo}</span>
                  {currentUser && currentUser.id !== post.userId && (
                    <button onClick={onToggleFollowUser} className="text-[11px] text-blue-400 hover:underline">
                      {isFollowingUser ? tt("unfollow") : tt("follow")}
                    </button>
                  )}
                </div>

                {/* More options menu */}
                <div className="relative">
                  <button
                    onClick={() => setMenuOpen(!menuOpen)}
                    className="text-zinc-500 hover:text-white p-1 rounded-full hover:bg-zinc-800 transition"
                  >
                    ⋯
                  </button>
                  {menuOpen && (
                    <div className="absolute left-0 top-6 z-20 w-36 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-1 text-xs space-y-0.5 animate-slide-down">
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(window.location.href);
                          setMenuOpen(false);
                        }}
                        className="w-full text-right p-2 rounded-xl hover:bg-zinc-800 text-zinc-300"
                      >
                        کپی لینک پست
                      </button>
                      {isOwner && (
                        <button
                          onClick={() => { onDelete(); setMenuOpen(false); }}
                          className="w-full text-right p-2 rounded-xl hover:bg-rose-950/50 text-rose-400 font-bold"
                        >
                          حذف پست
                        </button>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {/* Text */}
              <div data-user-content className="text-sm md:text-base text-zinc-100 mt-2 leading-relaxed whitespace-pre-wrap break-words">
                {formattedText}
              </div>
              {shouldTranslate && (
                <div className="mt-1.5 flex items-center gap-2 text-[11px]">
                  {showOriginal && translatedText && <span className="text-emerald-400">{tt("translated")}</span>}
                  {showOriginal && loadingTranslation && <span className="text-zinc-500">{tt("translateLoading")}</span>}
                  <button onClick={onToggleOriginal} className="text-blue-400 hover:underline">
                    {showOriginal ? tt("showOriginal") : tt("translate")}
                  </button>
                </div>
              )}

              {/* Media Attachments */}
              {post.media && post.media.length > 0 && (
                <div className={`mt-3 rounded-2xl overflow-hidden border border-zinc-800/80 grid ${post.media.length > 1 ? 'grid-cols-2' : 'grid-cols-1'} gap-1 bg-black`}>
                  {post.media.map((m, idx) => (
                    <div key={idx} onClick={() => onOpenMedia(m)} className="cursor-zoom-in relative aspect-video bg-zinc-900 group overflow-hidden">
                      {m.type === "video" ? (
                        <video src={m.url} className="w-full h-full object-cover" />
                      ) : (
                        <img src={m.url} className="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                      )}
                    </div>
                  ))}
                </div>
              )}

              {/* Action Buttons: Like, Comment, Bookmark, Share */}
              <div className="flex items-center justify-between mt-4 text-xs text-zinc-400 max-w-md">
                {/* Like Button */}
                <button
                  onClick={onToggleLike}
                  className="flex items-center gap-1.5 group p-1.5 rounded-full hover:bg-rose-950/30 transition"
                >
                  <Icons.Heart filled={isLiked} />
                  <span className={`text-xs ${isLiked ? 'text-rose-500 font-bold' : 'group-hover:text-rose-400'}`}>
                    {likesCount > 0 && likesCount}
                  </span>
                </button>

                {/* Comment Button */}
                <button
                  onClick={onOpenComment}
                  className="flex items-center gap-1.5 group p-1.5 rounded-full hover:bg-blue-950/30 transition"
                >
                  <Icons.Comment />
                  <span className="text-xs group-hover:text-blue-400">
                    {commentsCount > 0 && commentsCount}
                  </span>
                </button>

                {/* Bookmark Button */}
                <button
                  onClick={onToggleBookmark}
                  className="p-1.5 rounded-full hover:bg-yellow-950/30 transition"
                >
                  <Icons.Bookmark filled={isBookmarked} />
                </button>

                {/* Share Button */}
                <button
                  onClick={() => {
                    if (navigator.share) {
                      navigator.share({ title: "Inter X", text: post.text, url: window.location.href });
                    } else {
                      navigator.clipboard.writeText(window.location.href);
                      alert("لینک کپی شد!");
                    }
                  }}
                  className="p-1.5 rounded-full hover:bg-blue-950/30 transition"
                >
                  <Icons.Share />
                </button>
              </div>

            </div>
          </div>
        </article>
      );
    }

    // ==========================================
    // 10. COMMENT MODAL
    // ==========================================
    function CommentRow({ comment, preferredLanguage, ensureTranslation, translationCache, translationLoading, showOriginal, onToggleOriginal, uiLang }) {
      const tt = (key) => UI_TEXT[uiLang]?.[key] || UI_TEXT.en[key] || key;
      const detectedCommentLang = guessLanguage(comment.text || "");
      const sourceLang = detectedCommentLang === "auto" ? (comment.lang || "auto") : detectedCommentLang;
      const shouldTranslate = !!preferredLanguage && preferredLanguage !== sourceLang;
      const key = `comment:${comment.id}:${preferredLanguage}`;
      const translated = translationCache[key];
      const loading = !!translationLoading[key];

      useEffect(() => {
        if (shouldTranslate && showOriginal) {
          ensureTranslation("comment", comment.id, comment.text, sourceLang);
        }
      }, [shouldTranslate, showOriginal, ensureTranslation, comment.id, comment.text, sourceLang]);

      const text = showOriginal && shouldTranslate && translated ? translated : comment.text;

      return (
        <div className="pt-2 flex gap-2.5">
          <div className="w-7 h-7 rounded-full bg-blue-900/40 text-blue-400 font-bold text-xs flex items-center justify-center shrink-0">
            {comment.displayName?.[0] || "I"}
          </div>
          <div>
            <div className="flex items-center gap-1 text-xs">
              <span className="font-bold text-white">{comment.displayName}</span>
              <span className="text-zinc-500">@{comment.username}</span>
            </div>
            <p data-user-content className="text-xs text-zinc-200 mt-0.5">{text}</p>
            {shouldTranslate && (
              <div className="text-[10px] mt-0.5 flex items-center gap-2">
                {showOriginal && translated && <span className="text-emerald-400">{tt("translated")}</span>}
                {showOriginal && loading && <span className="text-zinc-500">{tt("translateLoading")}</span>}
                <button onClick={onToggleOriginal} className="text-blue-400 hover:underline">{showOriginal ? tt("showOriginal") : tt("translate")}</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function CommentModal({ postId, post, comments, currentUser, onAddComment, onClose, onRequireAuth, preferredLanguage, ensureTranslation, translationCache, translationLoading, showOriginalMap, onToggleOriginal, uiLang }) {
      const [commentText, setCommentText] = useState("");

      const handleSend = () => {
        if (!currentUser) {
          onRequireAuth();
          return;
        }
        if (!commentText.trim()) return;
        onAddComment(commentText);
        setCommentText("");
      };

      return (
        <Modal title="Comments" onClose={onClose}>
          <div className="space-y-4">
            {post && (
              <div className="p-3 rounded-2xl bg-zinc-900/60 border border-zinc-800 text-xs text-zinc-300">
                <span className="font-bold text-white block mb-1">@{post.username}:</span>
                {post.text}
              </div>
            )}

            {/* Comments List */}
            <div className="space-y-2 max-h-60 overflow-y-auto pr-1 divide-y divide-zinc-800/40">
              {comments.length === 0 ? (
                <div className="text-center py-6 text-xs text-zinc-500">Be the first to comment.</div>
              ) : (
                comments.map(c => (
                  <CommentRow
                    key={c.id}
                    comment={c}
                    preferredLanguage={preferredLanguage}
                    ensureTranslation={ensureTranslation}
                    translationCache={translationCache}
                    translationLoading={translationLoading}
                    showOriginal={!!showOriginalMap[`comment:${c.id}`]}
                    onToggleOriginal={() => onToggleOriginal("comment", c.id)}
                    uiLang={uiLang}
                  />
                ))
              )}
            </div>

            {/* Input Box */}
            <div className="flex gap-2 pt-2 border-t border-zinc-800">
              <input
                type="text"
                value={commentText}
                onChange={(e) => setCommentText(e.target.value)}
                placeholder="Write a comment..."
                className="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-blue-500"
              />
              <button
                onClick={handleSend}
                className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white"
              >
                ارسال
              </button>
            </div>
          </div>
        </Modal>
      );
    }

    // ==========================================
    // 11. PROFILE VIEW COMPONENT
    // ==========================================
    function ProfileView({ userId, currentUser, users, posts, likes, comments, bookmarks, follows, onUpdateProfile, onToggleLike, onToggleBookmark, onToggleFollow, onOpenComment, onDelete, onOpenMedia, onUserClick, preferredLanguage, ensureTranslation, translationCache, translationLoading, showOriginalMap, onToggleOriginal, uiLang }) {
      const user = users.find(u => u.id === userId) || currentUser;
      const isOwner = currentUser?.id === user?.id;
      const tt = (key) => UI_TEXT[uiLang]?.[key] || UI_TEXT.en[key] || key;
      const isFollowing = !!(currentUser && user && currentUser.id !== user.id && (follows?.[currentUser.id] || []).includes(user.id));
      const followingCount = (follows?.[user?.id] || []).length;
      const followersCount = Object.values(follows || {}).filter((ids) => Array.isArray(ids) && ids.includes(user?.id)).length;
      const [editModalOpen, setEditModalOpen] = useState(false);
      const [bioText, setBioText] = useState(user?.bio || "");
      const [nameText, setNameText] = useState(user?.displayName || "");

      const userPosts = [...posts].filter(p => p.userId === user?.id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      if (!user) {
        return <div className="p-8 text-center text-zinc-500 text-sm">پروفایل پیدا نشد.</div>;
      }

      return (
        <div>
          {/* Header Banner */}
          <div className="h-32 bg-gradient-to-r from-blue-950 via-zinc-900 to-black border-b border-zinc-800 relative">
            <div className="absolute -bottom-10 right-6 w-20 h-20 rounded-full ring-4 ring-black bg-zinc-900 border-2 border-blue-500/40 overflow-hidden flex items-center justify-center font-black text-2xl text-blue-400">
              {user.avatar ? <img src={user.avatar} className="w-full h-full object-cover" /> : user.displayName[0]}
            </div>
          </div>

          <div className="px-6 pt-12 pb-4 space-y-3">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-xl font-black text-white flex items-center gap-1.5">
                  {user.displayName}
                  {user.verified && <Icons.Verified />}
                </h2>
                <span className="text-xs text-zinc-400 font-mono">@{user.username}</span>
              </div>
              {isOwner && (
                <button
                  onClick={() => setEditModalOpen(true)}
                  className="px-4 py-1.5 rounded-full border border-zinc-700 hover:bg-zinc-800 font-bold text-xs text-white transition"
                >
                  ویرایش پروفایل
                </button>
              )}
              {!isOwner && currentUser && (
                <button
                  onClick={() => onToggleFollow(user.id)}
                  className={`px-4 py-1.5 rounded-full font-bold text-xs transition ${isFollowing ? 'border border-zinc-700 text-white hover:bg-zinc-800' : 'bg-blue-600 text-white hover:bg-blue-500'}`}
                >
                  {isFollowing ? tt("unfollow") : tt("follow")}
                </button>
              )}
            </div>

            <p className="text-sm text-zinc-200">{user.bio || "Inter Milan supporter"}</p>

            <div className="flex items-center gap-4 text-xs text-zinc-400 pt-1">
              <span>💙 عضو از {new Date(user.joinedAt || Date.now()).toLocaleDateString("fa-IR")}</span>
              <span>•</span>
              <span><b className="text-white">{userPosts.length}</b> پست</span>
              <span>•</span>
              <span><b className="text-white">{followersCount}</b> دنبال کننده</span>
              <span><b className="text-white">{followingCount}</b> دنبال شونده</span>
            </div>
          </div>

          {/* User Posts Feed */}
          <div className="border-t border-zinc-800/80 divide-y divide-zinc-800/50">
            {userPosts.length === 0 ? (
              <div className="p-12 text-center text-xs text-zinc-500">پستی توسط این کاربر منتشر نشده است.</div>
            ) : (
              userPosts.map(post => (
                <PostCard
                  key={post.id}
                  post={post}
                  currentUser={currentUser}
                  isLiked={(likes[post.id] || []).includes(currentUser?.id)}
                  likesCount={(likes[post.id] || []).length}
                  isBookmarked={(bookmarks[currentUser?.id] || []).includes(post.id)}
                  commentsCount={comments.filter(c => c.postId === post.id).length}
                  onToggleLike={() => onToggleLike(post.id)}
                  onToggleBookmark={() => onToggleBookmark(post.id)}
                  onOpenComment={() => onOpenComment(post.id)}
                  onDelete={() => onDelete(post.id)}
                  onOpenMedia={onOpenMedia}
                  onUserClick={(uid) => onUserClick(uid)}
                  preferredLanguage={preferredLanguage}
                  ensureTranslation={ensureTranslation}
                  translationCache={translationCache}
                  translationLoading={translationLoading}
                  showOriginal={!!showOriginalMap[`post:${post.id}`]}
                  onToggleOriginal={() => onToggleOriginal("post", post.id)}
                  uiLang={uiLang}
                />
              ))
            )}
          </div>

          {/* Edit Profile Modal */}
          {editModalOpen && (
            <Modal title="Edit profile" onClose={() => setEditModalOpen(false)}>
              <div className="space-y-3">
                <div>
                  <label className="text-xs text-zinc-400 block mb-1">نام نمایشی</label>
                  <input
                    type="text"
                    value={nameText}
                    onChange={(e) => setNameText(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-white"
                  />
                </div>
                <div>
                  <label className="text-xs text-zinc-400 block mb-1">درباره شما (Bio)</label>
                  <textarea
                    value={bioText}
                    onChange={(e) => setBioText(e.target.value)}
                    rows="3"
                    className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-white"
                  />
                </div>
                <button
                  onClick={() => {
                    onUpdateProfile({ ...user, displayName: nameText, bio: bioText });
                    setEditModalOpen(false);
                  }}
                  className="w-full py-2.5 rounded-xl bg-blue-600 font-bold text-xs text-white"
                >
                  ذخیره تغییرات
                </button>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ==========================================
    // 12. SECURE AUTH MODAL (PBKDF2 SHA-256)
    // ==========================================
    function AuthModal({ users, onClose, onSuccess }) {
      const [isRegister, setIsRegister] = useState(false);
      const [username, setUsername] = useState("");
      const [displayName, setDisplayName] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleAuth = async (e) => {
        e.preventDefault();
        setError("");
        const cleanUser = SecurityEngine.sanitizeUsername(username);

        if (cleanUser.length < 3) {
          setError("Username must be at least 3 characters without spaces.");
          return;
        }

        if (!SecurityEngine.validatePassword(password)) {
          setError("Password must have at least 8 chars and include upper, lower and number.");
          return;
        }

        setLoading(true);
        try {
          const existing = users.find(u => u.username === cleanUser);

          if (isRegister) {
            if (existing) {
              setError("This username is already taken.");
              setLoading(false);
              return;
            }
            const passwordRecord = await SecurityEngine.createPasswordRecord(password);
            const newUser = {
              id: "u_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
              username: cleanUser,
              displayName: displayName.trim() || cleanUser,
              bio: "Inter Milan supporter",
              avatar: "",
              passwordRecord,
              joinedAt: Date.now()
            };
            onSuccess(newUser);
          } else {
            if (!existing) {
              // Auto register with secure hash
              const passwordRecord = await SecurityEngine.createPasswordRecord(password);
              const newUser = {
                id: "u_" + Date.now(),
                username: cleanUser,
                displayName: cleanUser,
                bio: "Inter Milan supporter",
                avatar: "",
                passwordRecord,
                joinedAt: Date.now()
              };
              onSuccess(newUser);
              return;
            }
            if (existing.passwordRecord) {
              const isValid = await SecurityEngine.verifyPassword(password, existing.passwordRecord);
              if (!isValid) {
                setError("Invalid password.");
                setLoading(false);
                return;
              }
            }
            onSuccess(existing);
          }
        } catch (err) {
          setError("Security error while processing password.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <Modal title={isRegister ? "Create account" : "Secure login"} onClose={onClose}>
          <form onSubmit={handleAuth} className="space-y-3.5">
            {error && (
              <div className="p-2.5 rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-200 text-xs font-semibold">
                {error}
              </div>
            )}

            {isRegister && (
              <div>
                <label className="text-xs text-zinc-400 block mb-1">نام و نام خانوادگی / لقب</label>
                <input
                  type="text"
                  required
                  value={displayName}
                  onChange={(e) => setDisplayName(e.target.value)}
                  placeholder="Example: Alex Nerazzurri"
                  className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"
                />
              </div>
            )}

            <div>
              <label className="text-xs text-zinc-400 block mb-1">نام کاربری (Username)</label>
              <input
                type="text"
                required
                value={username}
                onChange={(e) => setUsername(e.target.value)}
                placeholder="example_user"
                className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500 font-mono"
              />
              <span className="text-[10px] text-zinc-500">حروف انگلیسی، عدد و زیرخط</span>
            </div>

            <div>
              <label className="text-xs text-zinc-400 block mb-1">رمز عبور امن (PBKDF2 SHA-256)</label>
              <input
                type="password"
                required
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="At least 8 chars with uppercase and number"
                className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500 font-mono"
              />
            </div>

            <button
              type="submit"
              disabled={loading}
              className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white shadow-lg shadow-blue-900/40 transition flex items-center justify-center gap-2"
            >
              {loading ? "Processing..." : (isRegister ? "Create account" : "Login")}
            </button>

            <div className="text-center pt-2 text-xs text-zinc-400">
              <button
                type="button"
                onClick={() => { setIsRegister(!isRegister); setError(""); }}
                className="text-blue-400 hover:underline font-bold"
              >
                {isRegister ? "Already have an account? Login" : "No account? Sign up"}
              </button>
            </div>
          </form>
        </Modal>
      );
    }

    // ==========================================
    // 13. GENERIC REUSABLE MODAL
    // ==========================================
    function Modal({ title, children, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={onClose}>
          <div className="w-full max-w-lg bg-zinc-950 border border-zinc-800/80 rounded-3xl p-5 shadow-2xl space-y-4 animate-slide-down" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between border-b border-zinc-800/60 pb-3">
              <h3 className="text-sm font-bold text-white">{title}</h3>
              <button onClick={onClose} className="text-zinc-500 hover:text-white p-1 rounded-full hover:bg-zinc-900 transition">✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // ==========================================
    // 14. MOUNT REACT APP
    // ==========================================
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<InterXApp />);
  </script>
</body>
</html>
